<main class="construction" id="main-content">
  <img
    class="construction__backdrop"
    src="{{ '/images/cyber-map/image-1.webp' | relative_url }}?v={{ asset_version | slice: 0, 8 }}"
    alt=""
    width="1536"
    height="1024"
  >

  <div class="construction__frame wide-shell">
    <header class="construction__masthead">
      <p class="construction__brand">赛博志</p>
      <p class="construction__edition">网站制作中</p>
    </header>

    <section class="construction__notice" aria-labelledby="construction-title">
      <p class="construction__kicker">卷首告示 · SITE IN PROGRESS</p>
      <h1 id="construction-title">山河既动，<br>史笔未落。</h1>
      <p class="construction__lead">《赛博志》正在修志。</p>
      <p class="construction__copy">我们正整理事实、校订脉络，也在寻找足以承载这个时代的叙事。待篇章成形，再与诸君共观智能天下之变。</p>

      <dl class="construction__progress" aria-label="编修进度">
        <div>
          <dt>其一</dt>
          <dd>史料校订</dd>
        </div>
        <div>
          <dt>其二</dt>
          <dd>势力梳理</dd>
        </div>
        <div>
          <dt>其三</dt>
          <dd>篇章编修</dd>
        </div>
      </dl>
    </section>

    <footer class="construction__footer">
      <p>事实为骨，演义为衣</p>
      <p>内容校订期间，暂不开放阅览</p>
    </footer>
  </div>
</main>
